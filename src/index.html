<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Air</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
    <script
      defer
      type="module"
      src="scripts/main.js"
    ></script>
  </head>
  <body class="page__body">
    <div class="page__header">
      <header class="header">
        <div class="container">
          <div class="header__top">
            <div class="container top-bar">
              <div class="top-bar__left">
                <a
                  href="#"
                  class="top-bar__logo"
                >
                  <img
                    class="logo"
                    src="./images/logo/Logo.svg"
                    alt="AIR"
                  />
                </a>
                <a
                  href="#menu"
                  class="top-bar__burger icon icon--burger"
                ></a>
              </div>
              <div class="top-bar__center">
                <nav class="top-bar__nav nav">
                  <a
                    href="#"
                    class="nav__item"
                    data-language="about-us"
                  >
                    About us
                  </a>
                  <a
                    href="#"
                    class="nav__item"
                    data-language="services"
                  >
                    Services
                  </a>
                  <a
                    href="#"
                    class="nav__item"
                    data-language="testimonials"
                  >
                    Testimonials
                  </a>
                  <a
                    href="#"
                    class="nav__item"
                    data-language="contact-us"
                  >
                    Contact Us
                  </a>
                </nav>
                <div class="top-bar__language-switcher language-switcher">
                  <div class="language-switcher__trigger">
                    <img
                      class="language-switcher__current-flag-country"
                      src="https://raw.githubusercontent.com/cristiroma/countries/c6edc915f71c06441fab4da306deac95a28d70aa/data/flags/SVG/US.svg"
                      alt="country flag"
                    />
                    <img
                      class="language-switcher__shevron"
                      src="./images/icons/arrow-left-white.svg"
                      alt="arrow"
                    />
                  </div>
                  <div class="language-switcher__content">
                    <div
                      data-country="US"
                      class="language-switcher__item"
                    >
                      <img
                        class="language-switcher__flag-country"
                        src="https://raw.githubusercontent.com/cristiroma/countries/c6edc915f71c06441fab4da306deac95a28d70aa/data/flags/SVG/US.svg"
                        alt="country flag"
                      />
                      <span class="language-switcher__language-code">
                        English
                      </span>
                    </div>
                    <div
                      data-country="UA"
                      class="language-switcher__item"
                    >
                      <img
                        class="language-switcher__flag-country"
                        src="https://raw.githubusercontent.com/cristiroma/countries/c6edc915f71c06441fab4da306deac95a28d70aa/data/flags/SVG/UA.svg"
                        alt="country flag"
                      />
                      <span class="language-switcher__language-code">
                        Ukraine
                      </span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="top-bar__right">
                <a
                  href="#"
                  class="top-bar__hire-us"
                  data-language="hire-us"
                >
                  HIRE US
                </a>
              </div>
            </div>
          </div>
          <div class="header__bottom">
            <div class="header__content">
              <h1
                data-language="header__title"
                class="header__title"
              >
                Strategic Agency
              </h1>
              <p
                data-language="header__subtitle"
                class="header__subtitle"
              >
                We believe in the power of bold ideas that can solve business
                challenges.
              </p>
              <a
                href="#about-us"
                class="header__cta button"
                data-language="learn-more"
              >
                Learn More
              </a>
            </div>
          </div>
        </div>
      </header>
      <section class="slider">
        <div class="swiper slider__swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide slider__item">
              <img
                src="./images/slider/slide-1.png"
                alt="Slide 1"
                class="slider__image"
              />
            </div>
            <div class="swiper-slide slider__item">
              <img
                src="./images/slider/slide-2.png"
                alt="Slide 2"
                class="slider__image"
              />
            </div>
            <div class="swiper-slide slider__item">
              <img
                src="./images/slider/slide-3.png"
                alt="Slide 3"
                class="slider__image"
              />
            </div>
          </div>
          <div class="slider__navigation slider__navigation--prev">
            <img
              src="./images/slider/arrow-left.svg"
              alt="Previous Slide"
            />
          </div>
          <div class="slider__navigation slider__navigation--next">
            <img
              src="./images/slider/arrow-right.svg"
              alt="Next Slide"
            />
          </div>
          <p
            data-language="slider__slide-text"
            class="slider__slide-text"
          >
            By the same illusion which lifts the horizon.
          </p>
        </div>
      </section>
    </div>
    <aside
      class="page__menu"
      id="menu"
    >
      <div class="menu">
        <div class="menu__content">
          <div class="menu__top container">
            <a
              href="#"
              class="menu__logo"
            >
              <img
                class="logo"
                src="./images/logo/Logo.svg"
                alt="AIR"
              />
            </a>
            <a
              href="#"
              class="menu__burger icon icon--close"
            ></a>
          </div>
          <div class="menu__bottom container">
            <nav class="menu__nav nav">
              <a
                href="#"
                class="nav__item"
                data-language="about-us"
              >
                About us
              </a>
              <a
                href="#"
                class="nav__item"
                data-language="services"
              >
                Services
              </a>
              <a
                href="#"
                class="nav__item"
                data-language="testimonials"
              >
                Testimonials
              </a>
              <a
                href="#"
                class="nav__item"
                data-language="contact-us"
              >
                Contact Us
              </a>
            </nav>
            <a
              href="#"
              class="menu__hire-us"
              data-language="hire-us"
            >
              HIRE US
            </a>
            <div class="menu__language-switcher language-switcher">
              <div class="language-switcher__trigger">
                <img
                  class="language-switcher__current-flag-country"
                  src="https://raw.githubusercontent.com/cristiroma/countries/c6edc915f71c06441fab4da306deac95a28d70aa/data/flags/SVG/US.svg"
                  alt="country flag"
                />
                <img
                  class="language-switcher__shevron"
                  src="./images/icons/arrow-left-white.svg"
                  alt="arrow"
                />
              </div>
              <div class="language-switcher__content">
                <div
                  data-country="US"
                  class="language-switcher__item"
                >
                  <img
                    class="language-switcher__flag-country"
                    src="https://raw.githubusercontent.com/cristiroma/countries/c6edc915f71c06441fab4da306deac95a28d70aa/data/flags/SVG/US.svg"
                    alt="country flag"
                  />
                  <span class="language-switcher__language-code">English</span>
                </div>
                <div
                  data-country="UA"
                  class="language-switcher__item"
                >
                  <img
                    class="language-switcher__flag-country"
                    src="https://raw.githubusercontent.com/cristiroma/countries/c6edc915f71c06441fab4da306deac95a28d70aa/data/flags/SVG/UA.svg"
                    alt="country flag"
                  />
                  <span class="language-switcher__language-code">Ukraine</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </body>
</html>
